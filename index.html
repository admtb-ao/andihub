<!DOCTYPE html>
<html lang="id" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise Stock Dashboard</title>
    
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        primary: { 50: '#eff6ff', 100: '#dbeafe', 500: '#3b82f6', 600: '#2563eb', 900: '#1e3a8a' },
                    }
                }
            }
        }
    </script>

    <!-- React, ReactDOM, Babel (untuk JSX) -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- TanStack Table & Virtual -->
    <script src="https://unpkg.com/@tanstack/react-table@8.11.2/build/umd/index.production.js"></script>
    <script src="https://unpkg.com/@tanstack/react-virtual@3.0.1/build/umd/index.production.js"></script>

    <!-- Utilities: SheetJS, jsPDF, Fuse, Chart.js -->
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; color: #0f172a; overflow: hidden; }
        .dark body { background-color: #09090b; color: #f8fafc; }
        
        /* Shadcn Glassmorphism & Scrollbar */
        .glass { background: rgba(255,255,255,0.7); backdrop-filter: blur(12px); border-bottom: 1px solid #e2e8f0; }
        .dark .glass { background: rgba(9,9,11,0.7); border-bottom: 1px solid #27272a; }
        
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .dark ::-webkit-scrollbar-thumb { background: #3f3f46; }
        
        /* Initial Loader */
        #initial-loader { position: fixed; inset: 0; background: #fff; z-index: 9999; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 16px; }
        .dark #initial-loader { background: #09090b; }
        .spinner { width: 40px; height: 40px; border: 4px solid #f3f3f3; border-top: 4px solid #3b82f6; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="initial-loader">
        <div class="spinner"></div>
        <div class="text-sm font-medium text-slate-500">Membangun Enterprise Workspace...</div>
    </div>
    
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        const { useState, useEffect, useMemo, useCallback, useRef, createContext, useContext } = React;
        const { useReactTable, getCoreRowModel, getFilteredRowModel, getSortedRowModel, flexRender } = ReactTable;
        const { useVirtualizer } = ReactVirtual;

        // ==========================================
        // 1. ENGINE: INDEXED DB & GOOGLE SHEETS FETCH
        // ==========================================
        const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/1oOR3gFw363uttAx6nFnf1ffVvVjY4v-dxn9C0Ij4VLU/export?format=csv";

        const dbPromise = new Promise((resolve) => {
            const req = indexedDB.open("EnterpriseStockDB", 1);
            req.onupgradeneeded = e => e.target.result.createObjectStore("cache");
            req.onsuccess = e => resolve(e.target.result);
        });

        async function saveCache(data) {
            const db = await dbPromise;
            db.transaction("cache", "readwrite").objectStore("cache").put(data, "latest");
        }

        async function loadCache() {
            const db = await dbPromise;
            return new Promise(res => {
                const req = db.transaction("cache").objectStore("cache").get("latest");
                req.onsuccess = () => res(req.result);
            });
        }

        async function fetchGoogleSheetData() {
            try {
                const res = await fetch(SHEET_CSV_URL);
                if (!res.ok) throw new Error("Network response was not ok");
                const csvText = await res.text();
                
                // Parse CSV using SheetJS
                const workbook = XLSX.read(csvText, { type: 'string' });
                const sheetName = workbook.SheetNames[0];
                const rawData = XLSX.utils.sheet_to_json(workbook.Sheets[sheetName], { defval: "" });
                
                if (rawData.length === 0) return null;
                const headers = Object.keys(rawData[0]);
                
                const result = { data: rawData, headers, lastSync: Date.now() };
                await saveCache(result);
                return result;
            } catch (err) {
                console.warn("Offline or fetch failed. Loading from cache...");
                return await loadCache();
            }
        }

        // ==========================================
        // 2. STATE MANAGEMENT & HASHMAP GENERATOR
        // ==========================================
        const AppContext = createContext();

        const AppProvider = ({ children }) => {
            const [rawData, setRawData] = useState([]);
            const [headers, setHeaders] = useState([]);
            const [isOffline, setIsOffline] = useState(false);
            const [lastSync, setLastSync] = useState(null);
            const [loading, setLoading] = useState(true);
            const [darkMode, setDarkMode] = useState(false);
            const [activeMenu, setActiveMenu] = useState("dashboard");

            const toggleDarkMode = () => {
                setDarkMode(!darkMode);
                document.documentElement.classList.toggle('dark');
            };

            const loadData = async (force = false) => {
                setLoading(true);
                const result = await fetchGoogleSheetData();
                if (result) {
                    setRawData(result.data);
                    setHeaders(result.headers);
                    setLastSync(result.lastSync);
                    setIsOffline(!navigator.onLine);
                }
                setLoading(false);
                document.getElementById('initial-loader').style.display = 'none';
            };

            // AUTO REFRESH 30 MIN
            useEffect(() => {
                loadData();
                const interval = setInterval(() => loadData(true), 30 * 60 * 1000);
                return () => clearInterval(interval);
            }, []);

            // HASHMAP (O(1) LOOKUP) & FUSE SEARCH
            const { maps, fuse } = useMemo(() => {
                const byKode = new Map();
                const byKategori = new Map();
                
                rawData.forEach(item => {
                    const kode = item['Kode Barang'] || item['Kode'] || item['ISBN'];
                    if (kode) byKode.set(String(kode).trim(), item);
                    
                    const kat = item['Kategori'];
                    if (kat) {
                        if (!byKategori.has(kat)) byKategori.set(kat, []);
                        byKategori.get(kat).push(item);
                    }
                });

                const fuse = new Fuse(rawData, {
                    keys: headers,
                    threshold: 0.3,
                    ignoreLocation: true
                });

                return { maps: { byKode, byKategori }, fuse };
            }, [rawData, headers]);

            return (
                <AppContext.Provider value={{
                    rawData, headers, maps, fuse, activeMenu, setActiveMenu,
                    loading, loadData, isOffline, lastSync, darkMode, toggleDarkMode
                }}>
                    {children}
                </AppContext.Provider>
            );
        };

        // ==========================================
        // 3. UI COMPONENTS (SHADCN STYLED)
        // ==========================================
        const Icon = ({ name, className = "" }) => (
            <span className={`material-symbols-outlined ${className}`} style={{ fontSize: '1.25rem' }}>{name}</span>
        );

        const Card = ({ children, className = "", title, value, icon }) => (
            <div className={`bg-white dark:bg-zinc-900 border border-slate-200 dark:border-zinc-800 rounded-xl shadow-sm p-5 ${className}`}>
                {title && (
                    <div className="flex justify-between items-center mb-2">
                        <h3 className="text-sm font-medium text-slate-500 dark:text-zinc-400">{title}</h3>
                        {icon && <Icon name={icon} className="text-slate-400" />}
                    </div>
                )}
                {value && <div className="text-2xl font-bold dark:text-white">{value}</div>}
                {children}
            </div>
        );

        const Button = ({ children, onClick, variant = "primary", className = "", icon }) => {
            const baseStyle = "inline-flex items-center justify-center gap-2 px-4 py-2 text-sm font-medium rounded-md transition-colors focus:outline-none focus:ring-2 focus:ring-offset-2 disabled:opacity-50 disabled:pointer-events-none";
            const variants = {
                primary: "bg-blue-600 text-white hover:bg-blue-700 focus:ring-blue-500",
                outline: "border border-slate-300 dark:border-zinc-700 hover:bg-slate-50 dark:hover:bg-zinc-800 dark:text-zinc-100",
                ghost: "hover:bg-slate-100 dark:hover:bg-zinc-800 dark:text-zinc-300 text-slate-700"
            };
            return (
                <button onClick={onClick} className={`${baseStyle} ${variants[variant]} ${className}`}>
                    {icon && <Icon name={icon} />}
                    {children}
                </button>
            );
        };

        const Badge = ({ children, className = "" }) => (
            <span className={`inline-flex items-center px-2 py-0.5 rounded-full text-xs font-medium bg-blue-100 text-blue-800 dark:bg-blue-900/30 dark:text-blue-300 ${className}`}>
                {children}
            </span>
        );

        // ==========================================
        // 4. VIEWS: DASHBOARD (CHART.JS)
        // ==========================================
        const DashboardView = () => {
            const { rawData, maps } = useContext(AppContext);
            const chartRef = useRef(null);
            const chartInstance = useRef(null);

            const stats = useMemo(() => {
                let stokKosong = 0;
                let stokSedikit = 0;
                let totalStok = 0;
                
                rawData.forEach(item => {
                    const stok = parseInt(item['Stok'] || 0);
                    totalStok += stok;
                    if (stok === 0) stokKosong++;
                    else if (stok < 10) stokSedikit++;
                });

                return { total: rawData.length, totalStok, stokKosong, stokSedikit, kats: maps.byKategori.size };
            }, [rawData]);

            useEffect(() => {
                if (!chartRef.current || maps.byKategori.size === 0) return;
                
                const labels = Array.from(maps.byKategori.keys()).slice(0, 7); // Top 7 Kategori
                const data = labels.map(k => maps.byKategori.get(k).length);

                if (chartInstance.current) chartInstance.current.destroy();
                
                chartInstance.current = new Chart(chartRef.current, {
                    type: 'bar',
                    data: {
                        labels,
                        datasets: [{
                            label: 'Jumlah Barang per Kategori',
                            data,
                            backgroundColor: '#3b82f6',
                            borderRadius: 6
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: { legend: { display: false } },
                        scales: { y: { beginAtZero: true, grid: { color: 'rgba(156, 163, 175, 0.1)' } }, x: { grid: { display: false } } }
                    }
                });
            }, [maps]);

            return (
                <div className="p-6 max-h-full overflow-auto space-y-6">
                    <div>
                        <h2 className="text-2xl font-bold tracking-tight dark:text-white">Dashboard Snapshot</h2>
                        <p className="text-slate-500 dark:text-zinc-400">Ringkasan seluruh stok berdasarkan Single Source of Truth.</p>
                    </div>
                    
                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                        <Card title="Total SKU/Judul" value={stats.total.toLocaleString()} icon="inventory_2" />
                        <Card title="Total Fisik Stok" value={stats.totalStok.toLocaleString()} icon="box" />
                        <Card title="Stok Kritis (<10)" value={stats.stokSedikit.toLocaleString()} icon="warning" className="border-l-4 border-l-yellow-500" />
                        <Card title="Stok Kosong (0)" value={stats.stokKosong.toLocaleString()} icon="error" className="border-l-4 border-l-red-500" />
                    </div>

                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                        <Card className="lg:col-span-2 h-96" title="Distribusi Kategori Utama">
                            <div className="relative h-[300px] w-full mt-4">
                                <canvas ref={chartRef}></canvas>
                            </div>
                        </Card>
                        <Card className="lg:col-span-1" title="Aksi Cepat">
                            <div className="space-y-3 mt-4">
                                <Button variant="outline" className="w-full justify-start" icon="download" onClick={() => {/* trigger export */}}>Export Excel Seluruh Data</Button>
                                <Button variant="outline" className="w-full justify-start" icon="picture_as_pdf" onClick={() => {/* trigger pdf */}}>Generate Katalog Master</Button>
                                <Button variant="outline" className="w-full justify-start" icon="upload_file" onClick={() => document.getElementById('btn-mass-lookup').click()}>Mass Lookup Excel</Button>
                            </div>
                        </Card>
                    </div>
                </div>
            );
        };

        // ==========================================
        // 5. VIEWS: TANSTACK VIRTUAL TABLE & FUSE SEARCH
        // ==========================================
        const TableView = () => {
            const { rawData, headers, fuse } = useContext(AppContext);
            const [searchQuery, setSearchQuery] = useState('');
            const [filteredData, setFilteredData] = useState(rawData);
            
            // Debounce Fuse Search
            useEffect(() => {
                const handler = setTimeout(() => {
                    if (!searchQuery) {
                        setFilteredData(rawData);
                        return;
                    }
                    const results = fuse.search(searchQuery).map(r => r.item);
                    setFilteredData(results);
                }, 300);
                return () => clearTimeout(handler);
            }, [searchQuery, rawData]);

            // Table Config
            const columns = useMemo(() => headers.map(h => ({
                accessorKey: h,
                header: h,
                cell: info => <div className="truncate max-w-[200px]" title={info.getValue()}>{info.getValue()}</div>
            })), [headers]);

            const table = useReactTable({
                data: filteredData,
                columns,
                getCoreRowModel: getCoreRowModel(),
            });
            const { rows } = table.getRowModel();

            // Virtualizer
            const parentRef = useRef(null);
            const virtualizer = useVirtualizer({
                count: rows.length,
                getScrollElement: () => parentRef.current,
                estimateSize: () => 40,
                overscan: 10,
            });

            // Export Data Table
            const exportExcel = () => {
                const ws = XLSX.utils.json_to_sheet(filteredData);
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, "Filter Data");
                XLSX.writeFile(wb, "Export_Stok.xlsx");
            };

            return (
                <div className="flex flex-col h-full overflow-hidden bg-white dark:bg-zinc-950">
                    {/* Header Table / Toolbar */}
                    <div className="p-4 glass z-20 flex flex-wrap gap-4 items-center justify-between">
                        <div className="relative w-full md:w-96">
                            <Icon name="search" className="absolute left-3 top-2.5 text-slate-400 text-lg" />
                            <input 
                                type="text"
                                placeholder="Fuzzy Search Global (Kode, Judul, Kategori...)" 
                                className="w-full pl-10 pr-4 py-2 border rounded-md text-sm focus:ring-2 focus:ring-blue-500 outline-none dark:bg-zinc-900 dark:border-zinc-700 dark:text-white transition-all"
                                value={searchQuery}
                                onChange={e => setSearchQuery(e.target.value)}
                            />
                        </div>
                        <div className="flex gap-2 items-center">
                            <Badge>{filteredData.length} Baris</Badge>
                            <Button variant="outline" icon="sim_card_download" onClick={exportExcel}>Export CSV/Excel</Button>
                        </div>
                    </div>

                    {/* Table Container */}
                    <div ref={parentRef} className="flex-1 overflow-auto relative">
                        <table className="w-full text-sm text-left whitespace-nowrap">
                            <thead className="sticky top-0 bg-slate-50 dark:bg-zinc-900 z-10 shadow-sm">
                                {table.getHeaderGroups().map(headerGroup => (
                                    <tr key={headerGroup.id}>
                                        {headerGroup.headers.map(header => (
                                            <th key={header.id} className="px-4 py-3 font-semibold text-slate-600 dark:text-slate-300 border-b dark:border-zinc-800">
                                                {flexRender(header.column.columnDef.header, header.getContext())}
                                            </th>
                                        ))}
                                    </tr>
                                ))}
                            </thead>
                            <tbody style={{ height: `${virtualizer.getTotalSize()}px`, position: 'relative' }}>
                                {virtualizer.getVirtualItems().map(virtualRow => {
                                    const row = rows[virtualRow.index];
                                    return (
                                        <tr key={row.id} 
                                            className="absolute w-full flex border-b dark:border-zinc-800/50 hover:bg-slate-50 dark:hover:bg-zinc-800/50 transition-colors group"
                                            style={{ top: 0, left: 0, transform: `translateY(${virtualRow.start}px)` }}
                                        >
                                            {row.getVisibleCells().map(cell => (
                                                <td key={cell.id} className="px-4 py-2 flex items-center group-hover:text-blue-700 dark:group-hover:text-blue-400">
                                                    {flexRender(cell.column.columnDef.cell, cell.getContext())}
                                                </td>
                                            ))}
                                        </tr>
                                    );
                                })}
                            </tbody>
                        </table>
                    </div>
                </div>
            );
        };

        // ==========================================
        // 6. VIEWS: MASS LOOKUP (SUPER FAST HASHMAP)
        // ==========================================
        const MassLookupView = () => {
            const { maps } = useContext(AppContext);
            const [resultData, setResultData] = useState([]);

            const handleFileUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (evt) => {
                    const bstr = evt.target.result;
                    const wb = XLSX.read(bstr, { type: 'binary' });
                    const wsname = wb.SheetNames[0];
                    const rawJson = XLSX.utils.sheet_to_json(wb.Sheets[wsname]);

                    // PROSES LOOKUP INSTAN VIA HASHMAP O(1)
                    const startTime = performance.now();
                    const enriched = rawJson.map(row => {
                        // Coba deteksi kunci
                        const key = String(row['Kode Barang'] || row['Kode'] || row['ISBN'] || Object.values(row)[0]).trim();
                        const dbItem = maps.byKode.get(key);
                        
                        if (dbItem) {
                            return { ...row, ...dbItem, 'Status Lookup': '✅ Ditemukan' };
                        }
                        return { ...row, 'Status Lookup': '❌ Tidak Ditemukan' };
                    });
                    const endTime = performance.now();
                    
                    setResultData(enriched);
                    alert(`Lookup selesai dalam ${(endTime - startTime).toFixed(2)} ms untuk ${enriched.length} baris!`);
                };
                reader.readAsBinaryString(file);
            };

            const downloadResult = () => {
                const ws = XLSX.utils.json_to_sheet(resultData);
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, "Hasil Lookup");
                XLSX.writeFile(wb, "Hasil_Mass_Lookup.xlsx");
            };

            return (
                <div className="p-6 max-w-4xl mx-auto space-y-6">
                    <Card title="Mass Lookup & Auto Fill Excel" icon="auto_awesome">
                        <p className="text-sm text-slate-500 dark:text-slate-400 mb-6">
                            Upload file Excel berisi daftar Kode Barang atau ISBN. Sistem akan mencocokkan puluhan ribu data dalam hitungan milidetik dari Google Sheet dan melengkapi kolom lainnya.
                        </p>
                        
                        <div className="border-2 border-dashed border-slate-300 dark:border-zinc-700 rounded-xl p-10 text-center hover:bg-slate-50 dark:hover:bg-zinc-800 transition-colors">
                            <Icon name="upload_file" className="text-4xl text-slate-400 mb-3 block mx-auto" />
                            <h4 className="font-semibold text-slate-700 dark:text-zinc-200">Pilih File Excel / CSV</h4>
                            <p className="text-xs text-slate-500 mt-1 mb-4">Maksimal 100.000 baris direkomendasikan untuk performa optimal.</p>
                            <input type="file" accept=".xlsx, .xls, .csv" onChange={handleFileUpload} className="hidden" id="file-upload" />
                            <Button onClick={() => document.getElementById('file-upload').click()}>Jelajahi File</Button>
                        </div>

                        {resultData.length > 0 && (
                            <div className="mt-8 border-t dark:border-zinc-800 pt-6">
                                <div className="flex justify-between items-center mb-4">
                                    <h4 className="font-semibold text-green-600 dark:text-green-400">Lookup Selesai! ({resultData.length} baris)</h4>
                                    <Button icon="download" onClick={downloadResult}>Download Hasil Excel</Button>
                                </div>
                                <div className="h-64 overflow-auto border rounded-md text-sm">
                                    <table className="w-full text-left whitespace-nowrap">
                                        <thead className="bg-slate-50 dark:bg-zinc-800 sticky top-0">
                                            <tr>{Object.keys(resultData[0]).slice(0, 5).map(k => <th key={k} className="p-2 border-b dark:border-zinc-700">{k}</th>)}</tr>
                                        </thead>
                                        <tbody>
                                            {resultData.slice(0, 50).map((row, i) => (
                                                <tr key={i} className="border-b dark:border-zinc-800/50">
                                                    {Object.keys(resultData[0]).slice(0, 5).map(k => <td key={k} className="p-2">{row[k]}</td>)}
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                                <p className="text-xs text-slate-400 mt-2">*Hanya menampilkan 50 baris pertama untuk preview.</p>
                            </div>
                        )}
                    </Card>
                </div>
            );
        };


        // ==========================================
        // 7. APP SHELL (SIDEBAR & LAYOUT)
        // ==========================================
        const AppShell = () => {
            const { activeMenu, setActiveMenu, lastSync, loadData, isOffline, darkMode, toggleDarkMode } = useContext(AppContext);

            // Keyboard Shortcuts
            useEffect(() => {
                const handleKeyDown = (e) => {
                    if (e.ctrlKey && e.key === 'f') { e.preventDefault(); setActiveMenu('table'); }
                    if (e.ctrlKey && e.key === 'r') { e.preventDefault(); loadData(true); }
                };
                window.addEventListener('keydown', handleKeyDown);
                return () => window.removeEventListener('keydown', handleKeyDown);
            }, [loadData]);

            const menuItems = [
                { id: 'dashboard', label: 'Dashboard', icon: 'space_dashboard' },
                { id: 'table', label: 'Semua Barang (Ctrl+F)', icon: 'table_view' },
                { id: 'lookup', label: 'Mass Lookup Excel', icon: 'troubleshoot' },
            ];

            return (
                <div className="flex h-screen overflow-hidden">
                    {/* Sidebar */}
                    <div className="w-64 bg-slate-900 text-slate-300 flex flex-col shrink-0">
                        <div className="h-16 flex items-center px-6 text-white font-bold text-lg tracking-tight border-b border-slate-800">
                            <Icon name="layers" className="mr-2 text-blue-500" />
                            StockEngine
                        </div>
                        <div className="flex-1 overflow-y-auto py-4 space-y-1">
                            {menuItems.map(item => (
                                <button 
                                    key={item.id}
                                    onClick={() => setActiveMenu(item.id)}
                                    className={`w-full flex items-center px-6 py-2.5 text-sm font-medium transition-colors ${activeMenu === item.id ? 'bg-blue-600 text-white' : 'hover:bg-slate-800 hover:text-white'}`}
                                >
                                    <Icon name={item.icon} className="mr-3 text-lg" />
                                    {item.label}
                                </button>
                            ))}
                        </div>
                        <div className="p-4 border-t border-slate-800 text-xs text-slate-500">
                            {isOffline ? (
                                <span className="text-yellow-500 flex items-center gap-1"><Icon name="cloud_off" className="text-sm"/> Mode Offline</span>
                            ) : (
                                <span className="text-green-500 flex items-center gap-1"><Icon name="cloud_done" className="text-sm"/> Online & Sinkron</span>
                            )}
                            <div className="mt-1">Last Sync: {lastSync ? new Date(lastSync).toLocaleTimeString() : '-'}</div>
                        </div>
                    </div>

                    {/* Main Content */}
                    <div className="flex-1 flex flex-col min-w-0">
                        {/* Topbar */}
                        <header className="h-16 glass z-30 flex items-center justify-between px-4 sm:px-6 shrink-0">
                            <h1 className="text-lg font-semibold dark:text-white capitalize">{activeMenu.replace('-', ' ')}</h1>
                            <div className="flex items-center gap-3">
                                <button onClick={toggleDarkMode} className="p-2 rounded-full hover:bg-slate-100 dark:hover:bg-zinc-800 text-slate-500 transition-colors" title="Toggle Dark Mode">
                                    <Icon name={darkMode ? "light_mode" : "dark_mode"} />
                                </button>
                                <Button variant="outline" icon="sync" onClick={() => loadData(true)}>Refresh Data</Button>
                            </div>
                        </header>

                        {/* View Router */}
                        <main className="flex-1 overflow-hidden relative">
                            {activeMenu === 'dashboard' && <DashboardView />}
                            {activeMenu === 'table' && <TableView />}
                            {activeMenu === 'lookup' && <MassLookupView />}
                            {/* Mass lookup hidden button trigger support */}
                            <button id="btn-mass-lookup" className="hidden" onClick={() => setActiveMenu('lookup')}></button>
                        </main>
                    </div>
                </div>
            );
        };

        const App = () => (
            <AppProvider>
                <AppShell />
            </AppProvider>
        );

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
